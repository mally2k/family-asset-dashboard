        :root {
            --primary: #6650a4;
            --primary-light: #eaddff;
            --primary-dark: #4a3880;
            --success: #4caf50;
            --danger: #ef5350;
            --warning: #ff9800;
            --info: #2196f3;
            --bg: #fffbfe;
            --surface: #f3edf7;
            --text: #1d1b20;
            --text-secondary: #49454f;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        #passwordScreen {
            position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);

            z-index: 1000; transition: opacity 0.5s, transform 0.5s;
        }
        #passwordScreen.hidden {
            opacity: 0; pointer-events: none; transform: scale(1.05);
        }
        .lock-icon { font-size: 64px; margin-bottom: 20px; }
        .lock-title { color: white; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .lock-subtitle { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 32px; }
        .pin-inputs { display: flex; gap: 12px; margin-bottom: 24px; }
        .pin-inputs input {
            width: 48px; height: 56px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: white; font-size: 24px; font-weight: 700;
            text-align: center; caret-color: white; outline: none; transition: all 0.2s;
        }
        .pin-inputs input:focus { border-color: white; background: rgba(255,255,255,0.2); }
        .pin-error { color: #ff9e9e; font-size: 13px; height: 20px; margin-bottom: 8px; }
        .unlock-btn {
            background: white; color: var(--primary); border: none; border-radius: 28px;
            padding: 14px 48px; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .unlock-btn:active { transform: scale(0.96); }
        .app { max-width: 900px; margin: 0 auto; padding: 16px; padding-bottom: 40px; display: none; }
        .app.visible { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
        .top-actions { display: flex; gap: 8px; }
        .top-btn {
            background: var(--primary-light); color: var(--primary); border: none;
            border-radius: 24px; padding: 10px 18px; font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .top-btn:active { transform: scale(0.95); }
        .top-btn.copied { background: var(--success); color: white; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;
        }
        .stat-card {
            background: #fff; border-radius: var(--radius); padding: 18px;
            box-shadow: var(--card-shadow); position: relative; overflow: hidden;
            cursor: pointer; transition: transform 0.15s;
        }
        .stat-card:active { transform: scale(0.98); }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        }
        .stat-card.primary::before { background: var(--primary); }
        .stat-card.success::before { background: var(--success); }
        .stat-card.danger::before { background: var(--danger); }
        .stat-card.info::before { background: var(--info); }
        .stat-card.warning::before { background: var(--warning); }
        .stat-card.crypto::before { background: #9c27b0; }
        .stat-card.estate::before { background: #795548; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .stat-value { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .stat-change {
            font-size: 12px; margin-top: 6px; font-weight: 600; display: inline-flex;
            align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px;
        }
        .stat-change.up { color: var(--success); background: #e8f5e9; }
        .stat-change.down { color: var(--danger); background: #ffebee; }
        .detail-btn {
            position: absolute; top: 14px; right: 14px;
            background: var(--surface); color: var(--primary);
            border: none; border-radius: 12px; padding: 4px 10px;
            font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .chart-section {
            background: #fff; border-radius: var(--radius); padding: 20px;
            margin-bottom: 16px; box-shadow: var(--card-shadow);
        }
        .chart-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
        .chart-container { position: relative; height: 420px; }
        .chart-container.small { height: 260px; }
        .chart-container.trend { height: 300px; }
        .chart-container.xsmall { height: 200px; }
        .alloc-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px;
        }
        .alloc-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            background: var(--surface); border-radius: 12px;
        }
        .alloc-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .alloc-info { flex: 1; min-width: 0; }
        .alloc-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .alloc-pct { font-size: 12px; color: var(--text-secondary); }
        .alloc-value { font-size: 13px; font-weight: 700; color: var(--primary); text-align: right; }
        .loading {
            text-align: center; padding: 60px 20px; color: var(--text-secondary);
        }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid var(--primary-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            text-align: center; padding: 20px; color: var(--text-secondary); font-size: 12px;
        }
        .maturity-list { display: flex; flex-direction: column; gap: 10px; }
        .maturity-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px; background: var(--surface);
        }
        .maturity-badge {
            font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 10px;
            white-space: nowrap;
        }
        .maturity-badge.danger { background: #ffebee; color: var(--danger); }
        .maturity-badge.warning { background: #fff3e0; color: #e65100; }
        .maturity-badge.success { background: #e8f5e9; color: var(--success); }
        .maturity-info { flex: 1; }
        .maturity-name { font-size: 13px; font-weight: 600; }
        .maturity-sub { font-size: 12px; color: var(--text-secondary); }
        .maturity-amount { font-size: 13px; font-weight: 700; color: var(--primary); }

        .load-modal, .detail-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: none; z-index: 2000; align-items: center; justify-content: center;
        }
        .load-modal.visible, .detail-modal.visible { display: flex; }
        .load-modal-box {
            background: #fff; border-radius: var(--radius); padding: 24px;
            max-width: 360px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .detail-modal-box {
            background: #fff; border-radius: var(--radius); padding: 24px;
            max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
        .load-option {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; border-radius: 12px; border: 2px solid var(--surface);
            margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
        }
        .load-option:hover { border-color: var(--primary-light); background: var(--surface); }
        .load-close, .detail-close {
            width: 100%; padding: 12px; margin-top: 8px;
            background: var(--surface); border: none; border-radius: 12px;
            font-size: 14px; font-weight: 600; color: var(--text-secondary);
            cursor: pointer;
        }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .detail-title { font-size: 18px; font-weight: 700; }
        .detail-x { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .detail-table th, .detail-table td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        .detail-table th { font-weight: 600; color: var(--text-secondary); background: var(--surface); }
        .detail-table td { color: var(--text); }
        .detail-total { margin-top: 12px; padding: 12px; background: var(--surface); border-radius: 12px; font-size: 14px; font-weight: 700; text-align: right; }

        #fileInput { display: none; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #323232; color: #fff; padding: 12px 24px; border-radius: 24px;
            font-size: 14px; font-weight: 500; z-index: 3000; opacity: 0;
            transition: all 0.3s ease; pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
            .alloc-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

<div id="passwordScreen">
    <div class="lock-icon">&#128274;</div>
    <div class="lock-title">유주네 자산 현황</div>
    <div class="lock-subtitle">비밀번호를 입력하세요</div>
    <div class="pin-inputs" id="pinInputs">
        <input type="password" maxlength="1" data-index="0" inputmode="numeric">
        <input type="password" maxlength="1" data-index="1" inputmode="numeric">
        <input type="password" maxlength="1" data-index="2" inputmode="numeric">
        <input type="password" maxlength="1" data-index="3" inputmode="numeric">
        <input type="password" maxlength="1" data-index="4" inputmode="numeric">
        <input type="password" maxlength="1" data-index="5" inputmode="numeric">
    </div>
    <div class="pin-error" id="pinError"></div>
    <button class="unlock-btn" id="unlockBtn" onclick="checkPassword()">확인</button>
</div>

<div class="app" id="mainApp">
    <div class="top-bar">
        <h1>유주네 자산 현황</h1>
        <div class="top-actions">
            <button class="top-btn" onclick="openLoadModal()">
                <span>&#128229;</span> 데이터로드
            </button>
            <button class="top-btn" id="shareBtn" onclick="shareLink()">
                <span>&#128279;</span> <span id="shareText">공유</span>
            </button>
        </div>
    </div>
    <div id="contentArea">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>자산 데이터를 불러오는 중...</p>
        </div>
    </div>
    <div class="footer">
        Family Asset Dashboard &middot; 데이터 출처: 유주네 자산 현황.xlsx
    </div>
</div>

<div class="load-modal" id="loadModal" onclick="if(event.target===this)closeLoadModal()">
    <div class="load-modal-box">
        <div class="modal-title">데이터 불러오기</div>
        <div class="modal-desc">엑셀 파일을 업로드하거나 GitHub에서 최신 데이터를 가져옵니다.</div>
        <div class="load-option" onclick="uploadExcel()">
            <div style="font-size:24px">&#128193;</div>
            <div style="flex:1">
                <div style="font-size:14px;font-weight:700">엑셀 파일 업로드</div>
                <div style="font-size:12px;color:var(--text-secondary)">수정한 .xlsx 파일을 선택</div>
            </div>
        </div>
        <div class="load-option" onclick="fetchFromGitHub()">
            <div style="font-size:24px">&#127760;</div>
            <div style="flex:1">
                <div style="font-size:14px;font-weight:700">GitHub에서 가져오기</div>
                <div style="font-size:12px;color:var(--text-secondary)">최신 엑셀 데이터를 자동 다운로드</div>
            </div>
        </div>
        <button class="load-close" onclick="closeLoadModal()">취소</button>
    </div>
</div>

<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetailModal()">
    <div class="detail-modal-box" id="detailModalBox"></div>
</div>

<input type="file" id="fileInput" accept=".xlsx" onchange="handleFileUpload(event)">
<div class="toast" id="toast"></div>

const pinInputs = document.querySelectorAll('#pinInputs input');
pinInputs.forEach((input, idx) => {
    input.addEventListener('input', (e) => {
        document.getElementById('pinError').textContent = '';
        if (e.target.value && idx < pinInputs.length - 1) pinInputs[idx + 1].focus();
    });

        if (e.key === 'Backspace' && !e.target.value && idx > 0) pinInputs[idx - 1].focus();
        if (e.key === 'Enter') checkPassword();

async function fetchFromGitHub() {
    closeLoadModal();
    showToast('GitHub에서 데이터를 불러오는 중...');
    try {
        const res = await fetch(GITHUB_RAW_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();
        const data = parseExcel(buf);
        if (data) {

function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    showToast('엑셀 파일을 분석하는 중...');
    const reader = new FileReader();
    reader.onload = (evt) => {
        try {
            const data = parseExcel(evt.target.result);
            if (data) {
                EMBEDDED_DATA = data;
                loadData();
                showToast('데이터 로드 완료! (' + data.metadata.last_updated + ')');
            }
        } catch (err) {
            console.error(err);
            showToast('엑셀 파싱 오류: ' + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
}

function parseExcel(arrayBuffer) {
    const wb = XLSX.read(arrayBuffer, { type: 'array', cellFormula: false });
    const wsDetail = wb.Sheets['상세 자산'];
    const wsLoan = wb.Sheets['대출'];
    if (!wsDetail) throw new Error('"상세 자산" 시트를 찾을 수 없습니다');

    const detail = XLSX.utils.sheet_to_json(wsDetail, { header: 1, defval: null });
    const loan = wsLoan ? XLSX.utils.sheet_to_json(wsLoan, { header: 1, defval: null }) : [];

    const monthlyData = {};
    const allDetails = [];
    for (let i = 1; i < detail.length; i++) {
        const row = detail[i];
        if (!row[0]) continue;
        const month = String(row[0]).trim();
        const category = String(row[1] || '').trim();
        const owner = String(row[2] || '').trim();
        const name = String(row[3] || '').trim();
        const amount = parseFloat(row[4]) || 0;
        const ret = row[5];
        const purpose = String(row[6] || '').trim();
        const maturity = row[7] ? String(row[7]).trim() : '-';
        const period = month.replace('2026년 ', '2026-').replace('3월','03').replace('4월','04').replace('5월','05').replace('6월','06').replace('7월','07').replace('8월','08').replace('9월','09').replace('10월','10').replace('11월','11').replace('12월','12');

        if (!monthlyData[period]) monthlyData[period] = {};
        if (!monthlyData[period][category]) monthlyData[period][category] = 0;
        monthlyData[period][category] += amount;

        allDetails.push({ month, period, category, owner, name, amount, return: ret, purpose, maturity, type: category });
    }

    Object.keys(monthlyData).forEach(p => { monthlyData[p]['부동산'] = 2200000000; });

    let loanTotal = 349025014;
    for (let i = 1; i < loan.length; i++) {
        const row = loan[i];
        if (row[0] === '총액' && row[2] && typeof row[2] === 'number') {
            loanTotal = row[2]; break;
        }
    }

    const periods = Object.keys(monthlyData).sort();
    const latestPeriod = periods[periods.length - 1];
    const latest = monthlyData[latestPeriod];

    const cashTotal = (latest['예금'] || 0) + (latest['적금'] || 0);
    const stocksTotal = latest['주식'] || 0;
    const pensionTotal = latest['개인연금'] || 0;
    const cryptoTotal = latest['가상화폐'] || 0;
    const realEstateTotal = latest['부동산'] || 0;
    const totalVal = cashTotal + stocksTotal + pensionTotal + cryptoTotal + realEstateTotal;
    const netVal = totalVal - loanTotal;

    const allocations = [
        { cat: 'real_estate', label: '부동산', amount: realEstateTotal },
        { cat: 'stocks', label: '주식', amount: stocksTotal },
        { cat: 'pension', label: '개인연금', amount: pensionTotal },
        { cat: 'cash', label: '현금/예금', amount: cashTotal },
        { cat: 'crypto', label: '가상화폐', amount: cryptoTotal },
    ];

    const assetAllocation = allocations.map(a => ({
        category: a.cat,
        category_label: a.label,
        amount_krw: Math.round(a.amount),
        percentage: totalVal > 0 ? parseFloat(((a.amount / totalVal) * 100).toFixed(2)) : 0
    })).filter(a => a.amount_krw > 0).sort((a, b) => b.amount_krw - a.amount_krw);

    const historicalTrends = periods.map(period => {
        const d = monthlyData[period];
        const t = (d['예금']||0) + (d['적금']||0) + (d['주식']||0) + (d['개인연금']||0) + (d['가상화폐']||0) + (d['부동산']||0);
        return {
            period,
            net_assets_krw: Math.round(t - loanTotal),
            categories: {
                cash: Math.round((d['예금']||0) + (d['적금']||0)),
                stocks: Math.round(d['주식']||0),
                pension: Math.round(d['개인연금']||0),
                crypto: Math.round(d['가상화폐']||0),
                real_estate: Math.round(d['부동산']||0)
            }
        };
    });

    // detail_breakdown
    const detailMap = { real_estate: [{name:'아파트',amount:2200000000,owner:'공동',purpose:'주거',return:null,maturity:'-'}], stocks: [], pension: [], cash: [], crypto: [] };
    const latestDetails = allDetails.filter(d => d.period === latestPeriod);
    latestDetails.forEach(d => {
        const item = { name: d.name, amount: Math.round(d.amount), owner: d.owner, purpose: d.purpose, return: d.return, maturity: d.maturity, type: d.type };
        if (d.category === '주식') detailMap.stocks.push(item);
        else if (d.category === '개인연금') detailMap.pension.push(item);
        else if (d.category === '예금' || d.category === '적금') detailMap.cash.push(item);
        else if (d.category === '가상화폐') detailMap.crypto.push(item);
    });

    return {
        total_valuation_krw: Math.round(totalVal),
        net_valuation_krw: Math.round(netVal),
        total_debt_krw: Math.round(loanTotal),
        currency: 'KRW',
        asset_allocation: assetAllocation,
        historical_trends: historicalTrends,
        detail_breakdown: detailMap,
        metadata: { source: '유주네 자산 현황.xlsx', last_updated: latestPeriod }
    };
}

function formatWon(value) {
    return Math.round(value / 10000).toLocaleString('ko-KR') + '만원';
}
function formatWonChart(valueInMan) {
    return Math.round(valueInMan).toLocaleString('ko-KR') + '만원';
}
function formatNumber(v) {
    return Math.round(v).toLocaleString('ko-KR');
}

function computeIndividualMin(trends) {
    const allValues = [];
    trends.forEach(t => {
        allValues.push((t.categories.cash || 0) / 10000);
        allValues.push((t.categories.stocks || 0) / 10000);
        allValues.push((t.categories.pension || 0) / 10000);
        allValues.push((t.categories.crypto || 0) / 10000);
    });
    return Math.max(0, Math.floor(Math.min(...allValues) * 0.90));
}

function getMaturityDays(dateStr) {
    if (!dateStr || dateStr === '-') return null;
    const parts = dateStr.split('.');
    if (parts.length < 3) return null;
    const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    const diff = Math.ceil((d - TODAY) / (1000 * 60 * 60 * 24));
    return diff;
}

        return { val: diff, pct };

                    padding: { top: 1, bottom: 1, left: 3, right: 3 }, clip: false
                }
            },
            scales: {
                y: { ticks: { callback: v => formatWonChart(v) }, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    }));

    // Individual Asset Trends (부동산 제외)
    const ctxInd = document.getElementById('individualChart').getContext('2d');
    charts.push(new Chart(ctxInd, {
        type: 'line',
        data: {
            labels: periods,
            datasets: [
                { label: '주식', data: trends.map(t => (t.categories.stocks || 0) / 10000), borderColor: COLORS.domestic_stock, backgroundColor: 'transparent', fill: false, tension: 0.3, pointRadius: 4, borderWidth: 2 },
                { label: '개인연금', data: trends.map(t => (t.categories.pension || 0) / 10000), borderColor: COLORS.pension, backgroundColor: 'transparent', fill: false, tension: 0.3, pointRadius: 4, borderWidth: 2 },
                { label: '현금/예금', data: trends.map(t => (t.categories.cash || 0) / 10000), borderColor: COLORS.cash, backgroundColor: 'transparent', fill: false, tension: 0.3, pointRadius: 4, borderWidth: 2 },
                { label: '가상화폐', data: trends.map(t => (t.categories.crypto || 0) / 10000), borderColor: COLORS.crypto, backgroundColor: 'transparent', fill: false, tension: 0.3, pointRadius: 4, borderWidth: 2 },
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { usePointStyle: true, padding: 16 } },
                tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + formatWonChart(ctx.raw) } },
                datalabels: {
                    display: 'auto', align: 'top', anchor: 'end', offset: 3,
                    color: '#333', font: { size: 10, weight: '600' },
                    formatter: (value) => formatWonChart(value),
                    backgroundColor: 'rgba(255,255,255,0.75)', borderRadius: 4,
                    padding: { top: 1, bottom: 1, left: 3, right: 3 }, clip: false
                }
            },
            scales: {
                x: { grid: { display: false } },
                y: { min: computeIndividualMin(trends), ticks: { callback: v => formatWonChart(v) }, grid: { color: '#f0f0f0' } }
            }
        }
    }));

    // 부동산 추이
    const ctxRE = document.getElementById('realEstateChart').getContext('2d');
    charts.push(new Chart(ctxRE, {
        type: 'line',
        data: {
            labels: periods,
            datasets: [{
                label: '부동산',
                data: dRealEstate,
                borderColor: COLORS.real_estate,
                backgroundColor: COLORS.real_estate + '30',
                fill: true, tension: 0.3, pointRadius: 4, borderWidth: 2
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => '부동산: ' + formatWonChart(ctx.raw) } },
                datalabels: {
                    display: 'auto', align: 'top', anchor: 'end', offset: 3,
                    color: '#333', font: { size: 10, weight: '600' },
                    formatter: (value) => formatWonChart(value),
                    backgroundColor: 'rgba(255,255,255,0.75)', borderRadius: 4,
                    padding: { top: 1, bottom: 1, left: 3, right: 3 }, clip: false
                }
            },
            scales: {
                y: { ticks: { callback: v => formatWonChart(v) }, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    }));

    // Allocation Doughnut
    const ctxAlloc = document.getElementById('allocChart').getContext('2d');
    charts.push(new Chart(ctxAlloc, {
        type: 'doughnut',
        data: {
            labels: allocation.map(a => a.category_label),
            datasets: [{
                data: allocation.map(a => a.amount_krw),
                backgroundColor: allocation.map(a => COLORS[a.category] || '#999'),
                borderWidth: 0
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: (ctx) => {
                            const pct = allocation[ctx.dataIndex].percentage;
                            return `${ctx.label}: ${formatWon(ctx.raw)} (${pct}%)`;
                        }
                    }
                },
                datalabels: {
                    display: true, color: '#fff', font: { size: 11, weight: '700' },
                    formatter: (value, ctx) => {
                        const label = ctx.chart.data.labels[ctx.dataIndex];
                        const pct = allocation[ctx.dataIndex].percentage;
                        return `${label}\n${pct}%`;
                    },
                    textAlign: 'center',
                    textShadowColor: 'rgba(0,0,0,0.3)', textShadowBlur: 4
                }
            }
        }
    }));

    // Purpose Horizontal Bar
    const ctxPurpose = document.getElementById('purposeChart').getContext('2d');
    charts.push(new Chart(ctxPurpose, {
        type: 'bar',
        data: {
            labels: purposeList.map(p => p.purpose),
            datasets: [{
                label: '금액',
                data: purposeList.map(p => p.amount / 10000),
                backgroundColor: purposeList.map((_, i) => {
                    const colors = ['#6650a4','#ef5350','#2196f3','#4caf50','#ff9800','#9c27b0','#795548','#00bcd4'];
                    return colors[i % colors.length] + 'CC';
                }),
                borderRadius: 8
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => formatWonChart(ctx.raw) } },
                datalabels: {
                    display: true, anchor: 'end', align: 'right', offset: 4,
                    color: '#333', font: { size: 11, weight: '600' },
                    formatter: (value) => formatWonChart(value)
                }
            },
            scales: {
                x: { ticks: { callback: v => formatWonChart(v) }, grid: { color: '#f0f0f0' } },
                y: { grid: { display: false } }
            }
        }
    }));
}
</script>
</body>
</html>
